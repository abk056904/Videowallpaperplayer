name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'

      - name: Configure CMake
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Run tests
        run: ./build/release/Release/vw_tests.exe

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoWallpaper-${{ github.sha }}
          path: |
            build/release/Release/VideoWallpaper.exe
            build/release/Release/*.dll
          retention-days: 7
